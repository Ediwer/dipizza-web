name: Desplegar funcion enquiry

# Se dispara solo cuando cambia la funcion, no en cada cambio de la web.
on:
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:        # tambien a mano desde la pestaña Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # El token es lo unico secreto aqui. La ref del proyecto es
      # publica: sale en la URL del panel.
      - name: Desplegar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy enquiry \
            --project-ref cdauxkkksubujtzxouwo
